[workspace]
members = ["crates/dsp-core", "crates/dsp-wasm"]
resolver = "3"

[workspace.package]
description = "Rust and WebAssembly digital signal analyzer"
edition = "2024"
repository = "https://github.com/alexthemitchell/rad.io"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true