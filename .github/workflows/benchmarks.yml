name: Benchmarks

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  native:
    name: Native benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: benchmark-native

      - name: Run native benchmark
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark:native 2>&1 | tee benchmark-native.txt

      - name: Add native benchmark summary
        if: always()
        shell: bash
        run: |
          if [[ -f benchmark-native.txt ]]; then
            {
              echo '## Native benchmark'
              echo
              echo '```text'
              cat benchmark-native.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload native benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-native.txt
          if-no-files-found: error
          retention-days: 90

  browser:
    name: Browser benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: benchmark-browser

      - name: Install wasm-pack
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: wasm-pack@0.15.0

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser benchmark
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark:browser 2>&1 | tee benchmark-browser.txt

      - name: Add browser benchmark summary
        if: always()
        shell: bash
        run: |
          if [[ -f benchmark-browser.txt ]]; then
            {
              echo '## Browser benchmark'
              echo
              echo '```text'
              cat benchmark-browser.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload browser benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-browser.txt
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 90
