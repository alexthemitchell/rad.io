name: Preview feedback
description: Report feedback from preview builds for triage and conversion
title: 'Preview feedback: '
labels:
  - type:feedback
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        This template is for preview build feedback. Triage target is <= 48 hours.

  - type: input
    id: build
    attributes:
      label: Build identifier
      description: Commit SHA, tag, or Pages deployment identifier
      placeholder: abc1234
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chromium 123 on Windows 11
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware used (if any)
      placeholder: none, HackRF One, RTL-SDR, etc.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected versus actual
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area label
      options:
        - area:devices
        - area:hackrf
        - area:rtl-sdr
        - area:dsp
        - area:audio
        - area:components
        - area:ui
        - area:viz
        - area:workers
        - area:recording
        - area:docs
        - area:ci
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - priority:p0
        - priority:p1
        - priority:p2
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk label (optional)
      options:
        - none
        - risk:perf-risk
        - risk:privacy-risk
        - risk:breaking-change-risk
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Extra notes and artifacts
      description: Include screenshots, logs, and links
    validations:
      required: false
